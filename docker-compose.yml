version: '3.8'

networks:
  quiz-net:
    driver: bridge

services:
  nginx_proxy:
    image: nginx:latest
    container_name: quiz_nginx_proxy
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - quiz-net
    depends_on:
      - web

  web:
    image: php:8.2-apache
    container_name: quiz_web_hardened
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    networks:
      - quiz-net
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=quiz_user
      - MYSQL_PASSWORD=SecureQuizPassword456!
      - MYSQL_DATABASE=quiz_db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  mysql_db:
    image: mysql:8.0
    container_name: quiz_mysql_hardened
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: SuperSecureRootPassword999!
      MYSQL_DATABASE: quiz_db
      MYSQL_USER: quiz_user
      MYSQL_PASSWORD: SecureQuizPassword456!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quiz-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: quiz_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - quiz-net

  grafana:
    image: grafana/grafana:latest
    container_name: quiz_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - quiz-net

  loki:
    image: grafana/loki:latest
    container_name: quiz_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - quiz-net

  promtail:
    image: grafana/promtail:latest
    container_name: quiz_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - quiz-net

volumes:
  mysql_data:
